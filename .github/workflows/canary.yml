# Source run only: readiness evidence is published by publish-evidence.yml
# after GitHub reports this workflow's official terminal timestamps.
name: ci-infra-canary

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basic-tests:
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 5
    steps:
      - name: Checkout canary
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run deterministic basic tests
        run: make test
