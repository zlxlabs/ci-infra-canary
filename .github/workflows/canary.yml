# Minimal active canary for GitHub Actions control plane + self-hosted ci pool.
# Result contract = workflow run metadata (status/conclusion/timestamps/url). No callbacks.
name: ci-infra-canary

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 5
    steps:
      - name: Runner and OS info
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-unknown}"
          echo "runner_os=${RUNNER_OS:-unknown}"
          echo "runner_arch=${RUNNER_ARCH:-unknown}"
          uname -a
          if [[ -f /etc/os-release ]]; then cat /etc/os-release; fi

      - name: Toolchain smoke
        run: |
          set -euo pipefail
          python3 --version
          uv --version
          node --version
          pnpm --version
          # CI pool provides DinD; read-only probe only (no build/run).
          docker version
