# Publisher runs from the default branch and consumes only official completed
# ci-infra-canary run/job metadata. It never invokes Gate or changes a source run.
name: publish-ci-readiness-evidence

on:
  workflow_run:
    workflows: [ci-infra-canary]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: ci-readiness-evidence-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, ci]
    timeout-minutes: 5
    steps:
      - name: Checkout default-branch publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read official source run and jobs
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p .evidence
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > .evidence/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" > .evidence/source-jobs.json

      - name: Build source-run evidence
        run: |
          set -euo pipefail
          python3 scripts/build_evidence.py \
            --source-run-json .evidence/source-run.json \
            --jobs-json .evidence/source-jobs.json \
            --observed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output .evidence/ci-readiness-evidence-v1.json
          python3 -m json.tool .evidence/ci-readiness-evidence-v1.json >/dev/null

      - name: Publish per-source-run evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-readiness-evidence-v1-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: .evidence/ci-readiness-evidence-v1.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish monotonic stable release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ci-readiness-evidence-v1
        run: |
          set -euo pipefail
          release_json=.evidence/release.json
          release_error=.evidence/release.error
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json" 2> "$release_error"; then
            python3 -m json.tool "$release_json" >/dev/null
          else
            if ! grep -Eq 'HTTP 404|Not Found' "$release_error"; then
              cat "$release_error" >&2
              exit 1
            fi
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "$RELEASE_TAG" \
              --notes "Latest schema v1 readiness evidence; Gate remains UNKNOWN until a real PR entry is available."
            printf '{"assets":[]}' > "$release_json"
          fi

          asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[] | select(.name == "ci-readiness-evidence-v1.json") | .id')"
          if [[ -z "$asset_id" ]]; then
            gh release upload "$RELEASE_TAG" .evidence/ci-readiness-evidence-v1.json --repo "$GITHUB_REPOSITORY"
          else
            if [[ ! "$asset_id" =~ ^[0-9]+$ ]]; then
              echo "stable release asset lookup returned an ambiguous id" >&2
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              -H 'Accept: application/octet-stream' > .evidence/existing-release.json
            action="$(python3 scripts/build_evidence.py \
              --compare-existing .evidence/existing-release.json \
              --candidate .evidence/ci-readiness-evidence-v1.json)"
            case "$action" in
              publish)
                gh release upload "$RELEASE_TAG" .evidence/ci-readiness-evidence-v1.json \
                  --repo "$GITHUB_REPOSITORY" --clobber
                ;;
              skip)
                echo "stable asset is already at an equal or newer source tuple; skip overwrite"
                ;;
              *)
                echo "unexpected stable asset action: $action" >&2
                exit 1
                ;;
            esac
          fi
