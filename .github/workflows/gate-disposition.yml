# Business-repo caller for zlxlabs/gate gate-v2-disposition.yml
# (source template: gate/templates/caller-gate-disposition.yml).
# Pinned @v2: the v2 tag only advances after this canary verifies it green,
# so @v2 always points at a canary-verified gate contract; the gate#404
# behavior-refutation read-back further requires evidence pinned to that
# fixed contract.
name: gate-disposition

on:
  workflow_dispatch:
    inputs:
      pr_number: { description: "pull request number", required: true, type: string }
      primary_run_id: { description: "canonical primary run id", required: true, type: string }
      primary_run_attempt: { description: "canonical primary run attempt", required: true, type: string }
      finding_id: { description: "exact current-audit finding id", required: true, type: string }
      reason: { description: "reason for the false-positive disposition", required: true, type: string }
      disposition: { description: "false-positive or deferred", required: false, type: string }
      counterevidence_json: { description: "false-positive JSON. kind omitted/literal_grep: command, output, result=refuted, pointer. kind=behavior_replay: nodeid, patch, finding_id, primary_run_id, primary_run_attempt, head_sha, runner, result=refuted, pointer", required: false, type: string }
      tracking_issue: { description: "same-repository issue reference for deferred", required: false, type: string }

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  disposition:
    permissions:
      actions: write
      contents: read
      pull-requests: read
    secrets:
      SILO_ACCESS_KEY: ${{ secrets.SILO_ACCESS_KEY }}
      SILO_SECRET_KEY: ${{ secrets.SILO_SECRET_KEY }}
    uses: zlxlabs/gate/.github/workflows/gate-v2-disposition.yml@v2
    # 公开仓仅映射专属仓级 Silo 凭据，不继承其他仓库秘密。
    with:
      pr_number: ${{ inputs.pr_number }}
      primary_run_id: ${{ inputs.primary_run_id }}
      primary_run_attempt: ${{ inputs.primary_run_attempt }}
      finding_id: ${{ inputs.finding_id }}
      reason: ${{ inputs.reason }}
      disposition: ${{ inputs.disposition }}
      counterevidence_json: ${{ inputs.counterevidence_json }}
      tracking_issue: ${{ inputs.tracking_issue }}
